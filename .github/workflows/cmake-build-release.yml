name: Release build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - build only, skip tag / GitHub release / Nexus upload
        required: false
        type: boolean
        default: true
      environment:
        description: Environment containing Nexus Mods secrets (only needed when dry run is off)
        required: false
        type: environment
      is_hotfix:
        description: Hotfix release - bumps the patch version (e.g. 0.2 -> 0.2.1) instead of the beta number
        required: false
        type: boolean
        default: false
      build_le1:
        description: Build Mass Effect 1
        required: false
        type: boolean
        default: true
      build_le2:
        description: Build Mass Effect 2
        required: false
        type: boolean
        default: true
      build_le3:
        description: Build Mass Effect 3
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      note: ${{ steps.version.outputs.note }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute version tag
        id: version
        shell: pwsh
        run: |
          $hotfix = "${{ inputs.is_hotfix }}" -eq "true"

          $versions = @()
          git tag --list | ForEach-Object {
            $t = $_
            if ($t -match '^(\d+)\.(\d+)\.(\d+)beta$') {
              $versions += [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
            } elseif ($t -match '^(\d+)\.(\d+)beta$') {
              $versions += [version]::new([int]$Matches[1], [int]$Matches[2], 0)
            } elseif ($t -match '^(\d+)\.(\d+)(?:\.(\d+))?$') {
              $patch = if ($Matches[3]) { [int]$Matches[3] } else { 0 }
              $versions += [version]::new([int]$Matches[1], [int]$Matches[2], $patch)
            }
          }

          $latest = $versions | Sort-Object | Select-Object -Last 1
          if (-not $latest) { $latest = [version]::new(0, 0, 0) }

          if ($hotfix) {
            $next = [version]::new($latest.Major, $latest.Minor, ($latest.Build + 1))
            $tag = "$($next.ToString())beta"
            while (git rev-parse --verify --quiet "refs/tags/$tag") {
              $next = [version]::new($next.Major, $next.Minor, ($next.Build + 1))
              $tag = "$($next.ToString())beta"
            }
          } else {
            $maxBeta = 0
            git tag --list '0.*beta' | ForEach-Object {
              if ($_ -match '^0\.(\d+)beta$') {
                $maxBeta = [Math]::Max($maxBeta, [int]$Matches[1])
              }
            }
            $tag = "0.$($maxBeta + 1)beta"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

          $note = "This is release $tag of the SuperAdjustmentStudio.`n`n**Full Changelog**: https://github.com/Reyuu/SuperAdjustmentStudio/commits/$tag"
          "note<<EOF" >> $env:GITHUB_OUTPUT
          $note >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Stamp version into plugin.h
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $path = "src\core\plugin.h"
          $content = Get-Content $path -Raw
          $content = $content -replace '(#define\s+PLUGIN_VERSION\s+)"[^"]*"', "`$1`"$tag`""
          $content = $content -replace '(#define\s+LPLUGIN_VERSION\s+)L"[^"]*"', "`$1L`"$tag`""
          Set-Content $path $content -NoNewline

      - name: Regenerate LExSDKv2 patch
        shell: pwsh
        run: python patches/LExSDKv2/enumerate.py --apply; git -C thirdparty/LExSDKv2 add -N Src/LESDK/Includes.hpp; git -C thirdparty/LExSDKv2 diff --output=../../patches/LExSDKv2/fix-sdk-layout.patch

      - name: Build and deploy
        shell: pwsh
        run: |
          $deployBase = "$env:RUNNER_TEMP\deploy"
          $env:DEPLOY_DIR_ME1 = "$deployBase\LE1"
          $env:DEPLOY_DIR_ME2 = "$deployBase\LE2"
          $env:DEPLOY_DIR_ME3 = "$deployBase\LE3"

          $games = @()
          if ("${{ inputs.build_le1 }}" -eq "true") { $games += "ME1" }
          if ("${{ inputs.build_le2 }}" -eq "true") { $games += "ME2" }
          if ("${{ inputs.build_le3 }}" -eq "true") { $games += "ME3" }

          if ($games.Count -eq 0) {
            Write-Error "No games selected for build."
            exit 1
          }

          foreach ($game in $games) {
            Write-Host "`n===== Building $game ====="
            .\build.bat Release clean $game
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $dest = Join-Path $deployBase $game.Replace("ME", "LE")
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            .\deploy.bat Release $game
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          .\compile_commands.bat

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: SuperAdjustmentStudio
          path: ${{ runner.temp }}\deploy\

  release:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    concurrency:
      group: beta-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Create release tag
        shell: pwsh
        run: |
          $tag = "${{ needs.build.outputs.tag }}"
          git tag $tag
          git push origin $tag

      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: SuperAdjustmentStudio
          path: release

      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path release\LE* -DestinationPath "SuperAdjustmentStudio-${{ needs.build.outputs.tag }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: SAS - ${{ needs.build.outputs.tag }}
          body: ${{ needs.build.outputs.note }}
          files: SuperAdjustmentStudio-${{ needs.build.outputs.tag }}.zip

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          filename: SuperAdjustmentStudio-${{ needs.build.outputs.tag }}.zip
          version: ${{ needs.build.outputs.tag }}
          display_name: SAS - ${{ needs.build.outputs.tag }}
          description: This is release ${{ needs.build.outputs.tag }} of the SuperAdjustmentStudio.
          changelog: ${{ needs.build.outputs.note }}
