name: Debug build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment containing Nexus Mods secrets
        required: true
        type: environment

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Regenerate LExSDKv2 patch
        shell: pwsh
        run: python patches/LExSDKv2/enumerate.py --apply; git -C thirdparty/LExSDKv2 diff --output=../../patches/LExSDKv2/fix-sdk-layout.patch

      - name: Build and deploy
        shell: pwsh
        run: .\build.bat Debug clean; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $env:DEPLOY_DIR = "$env:RUNNER_TEMP\deploy"; New-Item -ItemType Directory -Path $env:DEPLOY_DIR; .\deploy.bat Debug; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; .\compile_commands.bat Debug

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: SuperAdjustmentStudio-debug
          path: |
            ${{ runner.temp }}\deploy\*.asi
            ${{ runner.temp }}\deploy\*.pdb
